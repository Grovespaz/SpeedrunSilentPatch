[SilentPatch]
; CPU affinity mask to force for the game process. 1 pins it to one core, 0 disables forcing.
CpuAffinityMask=1
; Windowed mode: 0/Off disables, 1/Framed uses a normal window, 2/Borderless removes the title bar and frame.
WindowedMode=0
; This will make the game skip EAX/NVIDIA intro splashes, so it starts from the intro movies just like Steam version
; NOTE: Has no effect when used with Steam EXE
SkipIntroSplashes=1
; Allows to override units used by the game - 0 forces metric units, 1 forces imperial units,
; -1 makes the game use units based on system locale
Units=-1
; Use the desktop refresh rate instead of a forced 60Hz while in fullscreen mode. This will get rid of
; a flicker when starting the game on a high refresh rate display.
UseDesktopRefreshRate=1
; Controls cheat input: Normal keeps vanilla behaviour, Off disables cheats, Shift only accepts cheats while Shift is held,
; CapsLock only accepts cheats while Caps Lock is on, and ScrollLock only accepts cheats while Scroll Lock is on.
EnableCheats=Shift
; Replaces copyrighted ambience/cutscene audio with neutral alternatives where available.
ReplaceDMCAMusic=1