[SilentPatch]
; Windowed mode: `Off` disables, `Framed` uses a normal window, `Borderless` removes the title bar and frame.
WindowedMode=Off
; This will make the game skip EAX/NVIDIA intro splashes, so it starts from the intro movies just like Steam version
SkipIntroSplashes=1
; Controls cheat input: Normal keeps vanilla behaviour, Off disables cheats, Shift only accepts cheats while Shift is held,
; CapsLock only accepts cheats while Caps Lock is on, and ScrollLock only accepts cheats while Scroll Lock is on.
EnableCheats=Shift
; Replaces copyrighted ambience/cutscene audio with neutral alternatives where available.
ReplaceDMCAMusic=0
; CPU affinity mask to force for the game process. 1 pins it to one core, 0 disables forcing.
CpuAffinityMask=1