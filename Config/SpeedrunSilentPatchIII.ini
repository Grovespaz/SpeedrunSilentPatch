[SilentPatch]
; Windowed mode: 0/Off disables, 1/Framed uses a normal window, 2/Borderless removes the title bar and frame.
WindowedMode=0
; Keeps the game window above all other windows while windowed mode is enabled.
AlwaysOnTop=0
; CPU affinity mask to force for the game process. 1 pins it to one core, 0 disables forcing.
CpuAffinityMask=0
; Writes a full-process memory dump beside the game executable after a crash log, replacing the previous dump.
; Dumps can be large.
CreateFullMemoryDump=0
