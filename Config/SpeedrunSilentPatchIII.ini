[SilentPatch]
; Use the desktop refresh rate instead of a forced 60Hz while in fullscreen mode. This will get rid of
; a flicker when starting the game on a high refresh rate display.
UseDesktopRefreshRate=1
; Windowed mode: 0/Off disables, 1/Framed uses a normal window, 2/Borderless removes the title bar and frame.
WindowedMode=0
; Keeps the game window above all other windows while windowed mode is enabled.
AlwaysOnTop=0
